    - swscan.apple.com
    - mesu.apple.com
    - gspe*.*.apple.com
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - '*.stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
